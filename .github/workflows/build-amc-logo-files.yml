name: Build AMC logo files

on:
  push:
    paths:
      - '.github/workflows/build-amc-logo-files.yml'
      - 'amc-logos/amc-partners.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all 54 AMC logos
        shell: python
        run: |
          import json, pathlib, urllib.request, re

          data = json.load(open("amc-logos/amc-partners.json", encoding="utf-8"))
          out = pathlib.Path("amc-logos")
          out.mkdir(exist_ok=True)

          for item in data:
              url = item["url"]
              filename = url.rsplit("/", 1)[-1]
              filename = re.sub(r'__w60__h60__.*$', '.webp', filename)
              target = out / filename

              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  target.write_bytes(r.read())

              print(f"Downloaded: {item['name']} -> {filename}")

      - name: Commit logo files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amc-logos/*.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add 54 AMC logo files"
          git push